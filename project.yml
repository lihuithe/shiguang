name: ShiGuang
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

packages:
  ShiGuangCore:
    path: Packages/ShiGuangCore

targets:
  ShiGuang:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ShiGuangCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 拾光
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSPhotoLibraryUsageDescription: 拾光需要访问你的相册，才能随机回顾照片，并帮你删除不想要的照片。所有处理都只在本机进行。
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/ShiGuang.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.shiguang
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

schemes:
  ShiGuang:
    build:
      targets:
        ShiGuang: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ShiGuangCore/ShiGuangCoreTests
